name: Release

# Publica a imagem que a nfbmc-prod puxa sozinha. Roda SÓ em push na main,
# que só recebe código via PR aprovado. Sem workflow_dispatch de propósito:
# ninguém consegue publicar uma imagem a partir de outra branch.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/thewhk/nfbmc:latest
            ghcr.io/thewhk/nfbmc:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
